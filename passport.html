<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Passport Dashboard | Power Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white">

    <div class="site-wrapper">
        <div class="live-overlay"></div>

        <nav class="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] md:w-[80%] z-50 glass-panel px-8 py-4 flex justify-between items-center rounded-full">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="h-10 brightness-110">
                <span class="font-bold tracking-widest text-sm uppercase hidden md:block">Power Link Africa</span>
            </div>
            <div class="flex space-x-6 text-xs font-bold tracking-tighter">
                <a href="index.html" class="hover:text-green-500 transition">HOME</a>
                <a href="marketing.html" class="hover:text-green-400 transition">MARKETING</a>
            </div>
        </nav>

        <main class="relative z-10 max-w-6xl mx-auto pt-40 px-6 pb-20">
            <div class="flex justify-between items-center mb-12">
                <div>
                    <span class="text-xs text-green-500 font-bold tracking-[0.3em] uppercase">Verified Registry</span>
                    <h1 class="text-4xl md:text-5xl font-serif italic mt-2" id="displayID">PLA-SERIAL-001</h1>
                </div>
                <a href="index.html" class="glass-panel px-6 py-2 rounded-full text-xs font-bold tracking-widest hover:bg-white/10 transition uppercase">← Back to Search</a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 auto-rows-[180px]">
                
                <div class="md:col-span-2 md:row-span-2 glass-panel rounded-[3rem] p-10 flex flex-col justify-between border-green-500/20">
                    <div>
                        <span class="text-xs font-bold text-green-500 uppercase tracking-widest">Global Health Index</span>
                        <h2 class="text-7xl font-serif italic mt-4" id="status">Healthy</h2>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-xs opacity-60 font-bold uppercase tracking-widest">
                            <span>Efficiency Range</span>
                            <span>85%</span>
                        </div>
                        <div class="w-full bg-white/10 h-3 rounded-full overflow-hidden">
                            <div class="bg-green-500 h-full w-[85%] shadow-[0_0_15px_rgba(34,197,94,0.5)]"></div>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-[2rem] p-8 border border-white/5">
                    <span class="text-xs opacity-50 font-bold uppercase tracking-widest">Voltage (V)</span>
                    <p class="text-4xl font-serif mt-4 text-green-400" id="voltage">13.6</p>
                </div>

                <div class="glass-panel rounded-[2rem] p-8 border border-white/5">
                    <span class="text-xs opacity-50 font-bold uppercase tracking-widest">S. Gravity</span>
                    <p class="text-4xl font-serif mt-4 text-green-400" id="gravity">1.265</p>
                </div>

                <div class="md:col-span-2 glass-panel rounded-[2rem] p-8 flex items-center justify-between border border-white/5">
                    <div>
                        <span class="text-xs opacity-50 font-bold uppercase tracking-widest">Physical Integrity</span>
                        <p class="text-2xl font-serif italic mt-1" id="integrity">Grade A Verified</p>
                    </div>
                    <div class="h-14 w-14 rounded-full border-2 border-green-500 flex items-center justify-center text-green-500 shadow-[0_0_15px_rgba(34,197,94,0.2)]">✓</div>
                </div>

                <div class="glass-panel rounded-[2rem] p-8 border border-white/5">
                    <span class="text-xs opacity-50 font-bold uppercase tracking-widest">Expiry Date</span>
                    <p class="text-xl font-serif mt-4" id="expiryDate">Dec 2028</p>
                </div>

                <div class="glass-panel rounded-[2rem] p-8 bg-green-500/5 border-green-500/30">
                    <span class="text-xs text-green-400 font-bold uppercase tracking-widest">Buy-Back Credit</span>
                    <p class="text-3xl font-serif mt-4 text-white" id="buyback">₦45,000</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
